<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f1115"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#232834" stroke-width="2"/>
  
  <!-- Outer Crosshair Circle -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 3"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  
  <!-- Crosshair Axes -->
  <line x1="32" y1="4" x2="32" y2="16" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="60" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="16" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="60" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center Bullet Point -->
  <circle cx="32" cy="32" r="4" fill="#f59e0b"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
  
  <!-- Green Live Indicator -->
  <circle cx="52" cy="12" r="3.5" fill="#16a34a"/>
</svg>
